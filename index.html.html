<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOTCHAA</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080808;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .page {
      position: relative;
      width: min(1400px, 100vw);
      height: 100vh;
      max-height: 900px;
      overflow: hidden;
      background: #080808;
    }

    .hero-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: contrast(1.08) saturate(1.08);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(0,0,0,.72) 0%, rgba(0,0,0,.15) 28%, rgba(0,0,0,.05) 55%, rgba(0,0,0,.55) 100%);
    }

    .title {
      position: relative;
      z-index: 2;
      text-align: center;
      padding-top: clamp(35px, 7vh, 75px);
      font-size: clamp(3.5rem, 10vw, 9rem);
      line-height: .9;
      font-weight: 900;
      letter-spacing: .08em;
      color: #fff;
      text-shadow:
        0 4px 0 #111,
        0 0 18px rgba(255, 40, 0, .8),
        0 0 45px rgba(255, 20, 0, .45);
    }

    .subtitle {
      position: relative;
      z-index: 2;
      text-align: center;
      margin-top: 18px;
      font-size: clamp(.8rem, 2vw, 1.15rem);
      font-weight: 700;
      letter-spacing: .45em;
      text-transform: uppercase;
      color: #f2f2f2;
    }

    .bottom-message {
      position: absolute;
      z-index: 2;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: 90%;
      padding: 10px 22px;
      border: 1px solid rgba(255,255,255,.35);
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(5px);
      font-size: .85rem;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    @media (max-width: 600px) {
      .hero-image {
        object-position: center;
      }

      .subtitle {
        letter-spacing: .2em;
      }

      .bottom-message {
        font-size: .7rem;
        text-align: center;
      }
    }
  </style>
</head>
